spring.application.name=barber-booking-api
# Hosts like Render choose the port through PORT.
server.port=${PORT:8080}

# No secrets in this file: it is committed. Every secret comes from an environment variable or,
# on your own machine, from the git-ignored .env file (see .env.example).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barber_booking}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate

# Lets Flyway adopt a database that was created by Hibernate before Flyway was added.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Database work happens inside the services; views never load data lazily.
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Outgoing email. Defaults point at Mailpit from docker-compose.yml (inbox: http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@barberbooking.local}
# Give up on an unreachable or slow mail server after 10 s instead of waiting forever.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Brevo and most providers need STARTTLS on port 587; Mailpit ignores it.
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Base URL of the web app; verification links point to <frontend-url>/verify-email?token=...
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# API documentation and test console at /swagger-ui.html. Set SWAGGER_ENABLED=false in production.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Browser origins allowed to call the API (comma-separated). Default: the web app's dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# New accounts allowed per 24 hours in total. Each sends an email, and the free mail plan (300 a day)
# is shared with booking emails, so fake sign-ups from many addresses cannot use it all up.
app.registration.daily-limit=${REGISTRATION_DAILY_LIMIT:100}

# Accounts made admin on startup (comma-separated emails). Register the account first, then restart.
app.admin-emails=${ADMIN_EMAILS:}

# Uploaded images: size limits and where they are kept on this machine (git-ignored).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.local-dir=${STORAGE_DIR:uploads}
# In production photos live in Cloudflare R2 (STORAGE_TYPE=r2): a host's own disk is wiped on deploy.
app.storage.type=${STORAGE_TYPE:local}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}

# Health check at /actuator/health ("UP" when the app and database answer); nothing else is exposed.
# The mail server is left out: a slow SMTP should not make the host restart the app.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.health.mail.enabled=false

# Few connections: the free database plan allows a small number, and this app needs few.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Behind a hosting proxy (e.g. Render) set FORWARD_HEADERS_STRATEGY=framework so the real client IP
# is used for rate limiting. Leave "none" when the app is reached directly (headers could be faked).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
