# Test configuration: self-contained, so tests do not depend on local secrets.
# The datasource is provided by Testcontainers (see TestcontainersConfiguration).
spring.application.name=barber-booking-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=3600000

spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=test@barberbooking.local
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
app.storage.local-dir=${java.io.tmpdir}/barber-booking-test-uploads
app.reminders.enabled=false
app.rate-limit.enabled=false
# The whole suite signs up far more than a day's real limit; one test sets its own.
app.registration.daily-limit=100000
# The application-server keys of the worked example in RFC 8291 (public, test only).
app.push.public-key=BP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A8
app.push.private-key=yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw
app.push.subject=https://fade.test
app.async.enabled=false
# Lets tests count database queries (see BarberDirectoryTest); per-session reports stay quiet.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.health.mail.enabled=false
