# Render Blueprint: the API as a Docker web service. Secrets are entered in the Render dashboard
# (sync: false), never here; the database is Neon and photos are in Cloudflare R2.
services:
  - type: web
    name: fade-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false # e.g. https://getfade.gr
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the same address as FRONTEND_URL
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false # e.g. no-reply@getfade.gr
      - key: STORAGE_TYPE
        value: r2
      - key: R2_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
